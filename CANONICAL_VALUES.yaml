      Entre el piso de oscilaciones (orden normal, 0.058 eV) y la cota Planck
      2018 (0.12 eV). Criterio de falsacion declarado en Paper 4: fuera de ese
      rango a >3 sigma mata la prediccion. DESI DR5/Euclid esperan sigma~0.015 eV.
