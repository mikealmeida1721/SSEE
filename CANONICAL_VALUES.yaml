      ABSOLUTO: no contiene H0. Es LO QUE SSEE FIJA. En cualquier ajuste que
      varie H0, esta es la cantidad que se mantiene fija — nunca Omega_m.
      Vigilado por R25.

  Omega_m_cosm:
    formula:    "omega_m / h^2   con h = H0/100"
    value:      0.3088821
    origin:     derivado
    source:     "PRD ec. eq:omcosm_breakdown (evaluado en H0_alg = 67.962)"
    data_check: "Planck 2018: 0.3153 +- 0.0073  ->  0.88 sigma"
    depends_on: [omega_m, H0]
    affects:    [E_z, r_d, distancias_BAO]
