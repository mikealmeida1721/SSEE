  # ── Nivel 2: la suma y su fraccion ─────────────────────────────────────
  omega_m:
    formula:    "omega_b + omega_c + omega_nu"
    value:      0.1426675
    origin:     derivado
    source:     "PRD ec. eq:omcosm_breakdown; Paper 1 L499; src/ssee_core.py:OMEGA_M_H2"
    depends_on: [omega_b, omega_c, omega_nu]
