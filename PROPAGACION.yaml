# PROPAGACION.yaml — el mapa fuente → artefacto
#
# POR QUÉ EXISTE (2026-07-26)
# ---------------------------
# R33 y R34 cazan huellas de constantes que YO tengo que adivinar de antemano
# ("0.06902", "94.07"). Sirven para el error ya conocido, no para el siguiente.
# Este archivo habilita una señal GENÉRICA que no depende de adivinar nada:
#
#     si el script cambió DESPUÉS de generarse su log, el log es sospechoso
#
# Probado retrospectivamente contra el estado del 2026-07-25: habría marcado
# 4 de los 5 logs rancios DOCE DÍAS antes, sin saber qué constante buscar.
# El quinto (p3_h0anchor) no lo caza porque su script nunca cambió —tenía la
# constante hardcodeada—, y ése es exactamente el caso que cubre R34.
# Las dos reglas se complementan: R35 el artefacto viejo, R34 la fuente vieja.
#
# La comparación usa fechas de COMMIT (git), no mtime del sistema de archivos:
# un checkout reescribe mtime y mentiría.
#
# CÓMO MANTENERLO: al crear un log nuevo, añadir su línea. Los que falten
# aparecen contados como ABIERTO en el guardián (R35) — deuda visible y
# medible, no una nota suelta que nadie relee.

