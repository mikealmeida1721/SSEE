# SSEE-V3.6 — CLASS run, ω_m-direct CANONICAL background (OP-8 dissolved)
# w0 = -T_r/M_v = -(3phi+pi)/(2*(phi+pi)) ~ -0.8399
# wa = -(2phi+pi)/(2*(phi+pi))             ~ -0.6699
# Omega_phi = (3phi+pi)^2 / (4*(phi+pi)^2) ~ 0.8399
# --- Output ---
output = tCl,pCl,lCl,mPk
lensing = yes
l_max_scalars = 2500
# --- Dark energy (SSEE w0wa fluid) ---
Omega_fld = 0.8399         # = (3phi+pi)^2 / (4*(phi+pi)^2)
w0_fld = -0.8399           # = -T_r/M_v = -(3phi+pi)/(2*(phi+pi))
wa_fld = -0.6699           # = -(2phi+pi)/(2*(phi+pi))
# --- Matter sector: omega_m-DIRECT canonical (NO MIRA factor; OP-8 dissolved) ---
# Omega_m,CMB = omega_m/h^2 = 0.30889 (omega_b + omega_c + omega_nu)
# Omega_b = omega_b/h^2 = 0.02242/0.67962^2 = 0.04854
# Omega_cdm = 0.30889 - 0.04854 = 0.26035
Omega_b = 0.04854
Omega_cdm = 0.26035
# n_s = 1 - phi^{-7} = 0.96556
n_s = 0.96556
A_s = 2.1e-9               # Standard normalization (not algebraically fixed)
h = 0.67962
# --- Output files ---
root = output/ssee_v36_canonical_
overwrite_root = yes
