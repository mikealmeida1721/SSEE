# CONTROL (R53) de `techo_ssee_canonico.ini` — baseline LCDM de Planck 2018.
#
# POR QUE EXISTE (2026-09-08). Un numero solo no dice si el metodo esta bien:
# hay que pasar la MISMA receta por algo cuyo resultado se conoce. Aqui van los
# parametros de Planck 2018 TT,TE,EE+lowE+lensing (Aghanim et al. 2020, Tabla 2,
# columna 6), con la misma precision, el mismo z, el mismo k_max y los mismos
# neutrinos que la configuracion de SSEE.
#
# CRITERIO, escrito ANTES de correr para que no se pueda acomodar despues:
# el mismo integrador top-hat tiene que dar sigma8 = 0.8111 +/- 0.006. Si cae
# ahi, el metodo esta calibrado y el techo de SSEE se puede citar. Si no cae,
# el techo NO se cita como cantidad certificada, se diga lo que se diga del
# numero de SSEE.
#
# El intento anterior fallaba por esto mismo: las corridas LCDM guardadas no
# llevaban neutrinos masivos y salian 1.4% altas (0.8221 contra 0.8111).
#
#   ./class techo_lcdm_referencia.ini

output = mPk
z_pk = 0
P_k_max_h/Mpc = 10.
k_per_decade_for_pk = 50

# ── Planck 2018 TT,TE,EE+lowE+lensing ──────────────────────────────────
omega_b = 0.02237
omega_cdm = 0.1200
h = 0.6736

N_ur = 2.0328
N_ncdm = 1
m_ncdm = 0.06                   # eV — la baseline de Planck, un neutrino masivo

n_s = 0.9649
A_s = 2.100e-9
k_pivot = 0.05
tau_reio = 0.0544

root = output/techo_lcdm_referencia_
overwrite_root = yes
write_parameters = yes
