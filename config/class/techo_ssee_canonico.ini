# Techo sigma8 con A_s FIJADO a Planck — fondo CANONICO de SSEE.
#
# POR QUE EXISTE (2026-09-08). El 0.8335 que publican los papers salia de
# `output/can_cold__pk.dat`: un fichero SIN .ini, fuera del repositorio
# (class_ssee/output/ esta en .gitignore) y del mismo minuto que la corrida de
# dos sectores con la particula, retirada el 2026-08-01. No se podia certificar
# con que se corrio. En particular no consta que llevara NEUTRINOS MASIVOS, y
# el fondo canonico de SSEE si los lleva: Sum m_nu = 0.06849 eV, o sea
# omega_nu = 0.000735 dentro de omega_m = 0.142668. Sin ellos sobra poder a
# 8 Mpc/h justo en el orden del 1%, asi que el numero publicado podia ser el
# techo de una variante, no el del modelo.
#
# Esta configuracion pone los ingredientes leidos del nucleo (ssee_core.py),
# no re-tecleados: omega_b y omega_c algebraicos, h = H_alg/100, n_s = 1-phi^-7,
# w0 = -T_r/M_v, wa = -P_sc/K_v. A_s se CLAVA al valor de Planck, que es
# justamente la condicion que define el techo: heredar la amplitud en vez de
# ajustarla. Con A_s libre el resultado vivo es S8 = 0.7555 +/- 0.0192 (R3).
#
# Su control es `techo_lcdm_referencia.ini`, misma receta con la baseline de
# Planck 2018. Si el metodo esta calibrado, esa referencia tiene que caer en
# sigma8 = 0.8111 +/- 0.006.
#
#   ./class techo_ssee_canonico.ini

output = mPk
z_pk = 0
P_k_max_h/Mpc = 10.
k_per_decade_for_pk = 50

# ── materia: omega = Omega h^2, algebraicos (ssee_core.py) ──────────────
omega_b = 0.0224177568          # (pi-phi)/(3 Omega^2)
omega_cdm = 0.1195144084        # KAL0 . omega_b . n_s
h = 0.6796213732                # H_alg/100 = 3(phi+pi)^2 / 100

# ── neutrinos: LO QUE FALTABA. Sum m_nu = 0.06849 eV ────────────────────
N_ur = 2.0328                   # baseline: 2 sin masa + 1 masiva
N_ncdm = 1
m_ncdm = 0.06849                # eV — omega_nu = 0.06849/93.14 = 0.000735

# ── energia oscura: fluido w0-wa de SSEE, cierre por Omega_Lambda = 0 ───
Omega_Lambda = 0
w0_fld = -0.8399497713          # -T_r/M_v
wa_fld = -0.6699748857          # -P_sc/K_v
use_ppf = yes                   # w cruza -1 en el pasado: PPF, no fluido puro

# ── primordial: A_s CLAVADO a Planck. ESA es la condicion del techo ─────
n_s = 0.9655581463              # 1 - phi^-7
A_s = 2.1e-9
k_pivot = 0.05
tau_reio = 0.0544

root = output/techo_ssee_canonico_
overwrite_root = yes
write_parameters = yes
