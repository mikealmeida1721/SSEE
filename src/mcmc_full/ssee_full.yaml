# ============================================================================
# SSEE-V3.6 — MCMC FULL con Cobaya
#   w0waCDM (CAMB + PPF) vs likelihoods PLENAS:
#     - Planck 2018 plik_lite TTTEEE (nativo, sin clik)
#     - Planck 2018 lensing (nativo)
#     - prior gaussiano de tau (reemplaza lowl.EE; clik no disponible)
#     - DESI DR2 BAO (13 puntos, custom)
#     - fσ8 (6 encuestas, custom, fsigma8 nativo de CAMB)
#
# Reemplaza el prior comprimido de Planck del MCMC Fase 4 por la likelihood
# real de los Cℓ → mide H0 sin clavarlo al prior, y blinda contra el sesgo
# de distance priors en un modelo no-ΛCDM.
#
# Benchmark de comparación: H_alg = 3(φ+π)² = 67.962 km/s/Mpc (ancla global
# canónica post-reframe ω_m-directo; H_MIRA 67.037 quedó RETIRADO al disolverse
# OP-8 — ya no hay factor materia). H0 flota con prior plano [60,80]: el dato,
# no el ancla, elige. La chain mide H0 = 66.23 ± 1.55 (1.12σ de H_alg).
# ============================================================================

theory:
  camb:
    extra_args:
      dark_energy_model: ppf      # permite cruce fantasma w=-1 (z≈0.31) sin crash
      lens_potential_accuracy: 1
      WantTensors: false
      num_massive_neutrinos: 1
      nnu: 3.046

likelihood:
  planck_2018_highl_plik.TTTEEE_lite_native:
  planck_2018_lensing.native:
  ssee_likelihoods.DESIDR2BAO:
    python_path: /home/mike/Proyectos/SSEE/src/mcmc_full
  ssee_likelihoods.FSigma8:
    python_path: /home/mike/Proyectos/SSEE/src/mcmc_full

params:
  H0:
    prior: {min: 60, max: 80}
    ref: {dist: norm, loc: 67.0, scale: 1.0}
    proposal: 0.5
    latex: H_0
  ombh2:
    prior: {min: 0.019, max: 0.025}
    ref: {dist: norm, loc: 0.02237, scale: 0.0002}
    proposal: 0.0001
    latex: \Omega_\mathrm{b} h^2
  omch2:
    prior: {min: 0.09, max: 0.16}
    ref: {dist: norm, loc: 0.118, scale: 0.002}
    proposal: 0.001
    latex: \Omega_\mathrm{c} h^2
  logA:
    prior: {min: 2.9, max: 3.2}
    ref: {dist: norm, loc: 3.05, scale: 0.02}
    proposal: 0.01
    drop: true
    latex: \ln(10^{10} A_\mathrm{s})
  As:
    value: 'lambda logA: 1e-10 * np.exp(logA)'
    latex: A_\mathrm{s}
    derived: false
  ns:
    prior: {min: 0.92, max: 1.02}
    ref: {dist: norm, loc: 0.9656, scale: 0.004}
    proposal: 0.002
    latex: n_\mathrm{s}
  tau:
    prior: {dist: norm, loc: 0.054, scale: 0.0073}   # SRoll2 / lowE-equiv (sin clik)
    ref: {dist: norm, loc: 0.054, scale: 0.006}
    proposal: 0.003
    latex: \tau_\mathrm{reio}
  w:
    prior: {min: -1.5, max: -0.5}
    ref: {dist: norm, loc: -0.84, scale: 0.05}
    proposal: 0.03
    latex: w_0
  wa:
    prior: {min: -1.6, max: 0.5}
    ref: {dist: norm, loc: -0.67, scale: 0.10}
    proposal: 0.05
    latex: w_a
  # --- fijos ---
  mnu: 0.069        # Σm_ν canónico SSEE (self-consistente con H_MIRA)
  omk: 0.0
  # --- derivados ---
  omegam:
    latex: \Omega_\mathrm{m}
  sigma8:
    latex: \sigma_8
  S8:
    derived: 'lambda sigma8, omegam: sigma8 * (omegam / 0.3) ** 0.5'
    latex: S_8
  rdrag:
    latex: r_\mathrm{drag}

sampler:
  mcmc:
    Rminus1_stop: 0.05
    max_tries: 2000
    learn_proposal: true
    drag: false

output: /home/mike/Proyectos/SSEE/class_ssee/output/mcmc_full/ssee_full
